name: Cypress E2E Tests

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7.4.4
        with:
          start: npm run serve
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120
